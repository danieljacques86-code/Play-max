<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV Premium</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: #fff;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 1000;
      height: 60px;
      background: #212121;
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid #303030;
    }

    .logo {
      font-size: 20px;
      font-weight: bold;
      color: #ff0000;
    }

    .search {
      flex: 1;
      height: 40px;
      border-radius: 20px;
      border: 1px solid #333;
      outline: none;
      padding: 0 16px;
      background: #121212;
      color: #fff;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 20px;
      padding: 20px;
    }

    .content {
      min-width: 0;
    }

    .player-box {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #2a2a2a;
    }

    .player-box iframe,
    .player-box video {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
    }

    .video-info {
      margin-top: 14px;
    }

    .video-info h2 {
      font-size: 22px;
      margin-bottom: 6px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .channel {
      background: #1c1c1c;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      text-align: left;
      cursor: pointer;
    }

    .channel.active {
      background: #ff0000;
    }

    @media (max-width: 900px) {
      .layout {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 600px) {
      .layout {
        padding: 12px;
      }

      .search {
        height: 36px;
      }

      .channel {
        padding: 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">IPTV Premium</div>
    <input type="text" class="search" placeholder="Buscar canal..." />
  </header>

  <main class="layout">
    <section class="content">
      <div class="player-box">
        <iframe src="" title="Player" allowfullscreen></iframe>
      </div>

      <div class="video-info">
        <h2>Nome do canal</h2>
        <p>Assistindo agora</p>
      </div>
    </section>

    <aside class="sidebar">
      <button class="channel active">ESPN 1</button>
      <button class="channel">ESPN 2</button>
      <button class="channel">SporTV</button>
      <button class="channel">Globo</button>
    </aside>
  </main>
</body>
</html>
