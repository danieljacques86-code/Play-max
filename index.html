<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPTV Player PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { margin:0; background:#0b0b0b; color:#fff; font-family:Arial, sans-serif; overflow-x: hidden; }
        header { background:#111; padding:15px; text-align:center; font-size:22px; font-weight: bold; border-bottom: 2px solid #333; }
        
        /* Container do vídeo fixo no topo para melhor experiência */
        .video-container { position: sticky; top: 0; z-index: 100; background: #000; }
        video { width:100%; max-height:280px; background:black; display: block; }
        
        #busca { width:90%; margin:15px auto; display:block; padding:12px; border:none; border-radius:8px; font-size:16px; background: #222; color: #fff; outline: none; }
        #busca:focus { border: 1px solid #0078ff; }

        #lista { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px; padding:15px; }
        
        .canal { 
            background:#1c1c1c; 
            padding:15px; 
            border-radius:10px; 
            text-align:center; 
            cursor:pointer; 
            transition: 0.2s; 
            font-size: 14px; 
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 50px;
            word-break: break-word;
        }
        .canal:hover { background:#0078ff; transform: translateY(-3px); border-color: #fff; }
        
        .loading, .erro { text-align: center; padding: 20px; font-size: 18px; }
        .erro { color: #ff4444; }
    </style>
</head>
<body>

<header>📺 IPTV Player PRO</header>

<div class="video-container">
    <video id="video" controls autoplay></video>
</div>

<input type="text" id="busca" placeholder="🔍 Buscar canal ou categoria...">

<div id="lista" class="loading">Carregando canais, aguarde...</div>

<script>
    // Configurações da Lista
    const urlLista = "https://api.allorigins.win/raw?url=http://newoneblue.site:80/player_api.php?username=Vanessa1234&password=Vanessa1234&type=m3u&output=m3u8";
    
    const video = document.getElementById('video');
    const listaDiv = document.getElementById("lista");
    let hls = new Hls();

    // FUNÇÃO PARA DAR PLAY
    function play(url) {
        if (Hls.isSupported()) {
            hls.destroy(); // Limpa a instância anterior
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = url;
            video.play();
        }
        // Rola a tela para o vídeo ao clicar
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    // PARSER M3U OTIMIZADO
    function parseM3U(text) {
        const linhas = text.split("\n");
        let listaCanais = [];
        let nomeAtual = "";

        for (let i = 0; i < linhas.length; i++) {
            let linha = linhas[i].trim();
            if (linha.startsWith("#EXTINF")) {
                // Captura o nome após a última vírgula
                const regexNome = /,(.+)$/;
                const match = linha.match(regexNome);
                nomeAtual = match ? match[1].trim() : "Canal sem nome";
            } else if (linha.startsWith("http")) {
                listaCanais.push({ nome: nomeAtual, url: linha });
            }
        }
        return listaCanais;
    }

    // RENDERIZAR NA TELA
    function render(canais) {
        listaDiv.innerHTML = "";
        if (canais.length === 0) {
            listaDiv.innerHTML = "<p class='erro'>Nenhum canal encontrado.</p>";
            return;
        }
        
        // DocumentFragment melhora o desempenho ao renderizar muitos itens
        const fragment = document.createDocumentFragment();
        canais.forEach(c => {
            const div = document.createElement("div");
            div.className = "canal";
            div.innerText = c.nome;
            div.onclick = () => play(c.url);
            fragment.appendChild(div);
        });
        listaDiv.appendChild(fragment);
    }

    // BUSCA
    document.getElementById("busca").addEventListener("input", e => {
        const termo = e.target.value.toLowerCase();
        const filtrados = window.allCanais.filter(c => c.nome.toLowerCase().includes(termo));
        render(filtrados);
    });

    // CARREGAR LISTA VIA PROXY (Para evitar erro de CORS)
    fetch(urlLista)
        .then(res => {
            if (!res.ok) throw new Error();
            return res.text();
        })
        .then(text => {
            window.allCanais = parseM3U(text);
            render(window.allCanais);
        })
        .catch(() => {
            listaDiv.innerHTML = "<p class='erro'>❌ Erro ao carregar lista.<br><small>Verifique sua conexão ou se os dados de acesso estão expirados.</small></p>";
        });
</script>

</body>
</html>
