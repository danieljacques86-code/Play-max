<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>IPTV Premium</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

    <!-- Vídeo de fundo -->
    <video class="bg-video" autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/video/2016/09/13/5129-183300007_tiny.mp4" type="video/mp4">
    </video>

    <!-- Camada escura para melhorar leitura -->
    <div class="bg-overlay"></div>

    <header>📺 IPTV Premium</header>

    <div class="container">
        <div class="sidebar">
            <input type="text" id="buscar" placeholder="Buscar canal...">
            <div id="lista"></div>
        </div>

        <div class="player">
            <video id="video" controls autoplay></video>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
