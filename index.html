<script>
const server = "http://flixxxx.ddns.net:8080";
const user = "anacarolinaff14";
const pass = "4728321";

const proxy = (url) => 
  "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);

const video = document.getElementById("video");
const lista = document.getElementById("lista");

// segurança básica (evita crash)
if (!video || !lista) {
    document.body.innerHTML = "❌ ERRO: elementos HTML não encontrados (#video ou #lista)";
}

// PLAYER
function play(url){
    if(window.Hls && Hls.isSupported()){
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

// 🔥 CARREGAR CATEGORIAS
lista.innerHTML = "Carregando categorias...";

fetch(proxy(`${server}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`))
.then(r => r.text()) // 🔥 primeiro como TEXTO
.then(text => {
    let cats;

    try {
        cats = JSON.parse(text); // tenta converter
    } catch(e) {
        throw new Error("Resposta inválida (não é JSON)");
    }

    lista.innerHTML = "";

    if (!cats || cats.length === 0) {
        lista.innerHTML = "⚠️ Nenhuma categoria encontrada";
        return;
    }

    cats.forEach(cat=>{
        const div = document.createElement("div");
        div.className="item";
        div.innerText = "📂 " + cat.category_name;

        div.onclick = () => carregarCanais(cat.category_id);

        lista.appendChild(div);
    });
})
.catch(err => {
    console.error(err);
    lista.innerHTML = "❌ Erro ao carregar categorias<br><br>Servidor bloqueou ou caiu";
});

// 🔥 CARREGAR CANAIS
function carregarCanais(catId){
    lista.innerHTML = "Carregando canais...";

    fetch(proxy(`${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`))
    .then(r => r.text())
    .then(text => {
        let data;

        try {
            data = JSON.parse(text);
        } catch(e) {
            throw new Error("Erro ao converter canais");
        }

        const filtrados = data.filter(c=>c.category_id == catId);

        lista.innerHTML = "";

        if (filtrados.length === 0) {
            lista.innerHTML = "⚠️ Nenhum canal nessa categoria";
            return;
        }

        filtrados.forEach(c=>{
            const div = document.createElement("div");
            div.className="item";
            div.innerText = c.name;

            div.onclick = ()=>{
                const url = `${server}/live/${user}/${pass}/${c.stream_id}.m3u8`;
                play(url);
            }

            lista.appendChild(div);
        });
    })
    .catch(err=>{
        console.error(err);
        lista.innerHTML = "❌ Erro ao carregar canais";
    });
}
</script>
