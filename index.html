<script>
const server = "http://flixxxx.ddns.net:8080";
const user = "anacarolinaff14";
const pass = "4728321";

const proxy = (url) => 
  "https://api.allorigins.win/raw?url=" + encodeURIComponent(url);

const video = document.getElementById("video");
const lista = document.getElementById("lista");

function play(url){
    if(Hls.isSupported()){
        const hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
    } else {
        video.src = url;
    }
}

// 🔥 1 - carregar categorias primeiro (rápido)
fetch(proxy(`${server}/player_api.php?username=${user}&password=${pass}&action=get_live_categories`))
.then(r=>r.json())
.then(cats=>{
    lista.innerHTML = "";

    cats.forEach(cat=>{
        const div = document.createElement("div");
        div.className="item";
        div.innerText = "📂 " + cat.category_name;

        div.onclick = () => carregarCanais(cat.category_id);

        lista.appendChild(div);
    });
});

// 🔥 2 - carregar canais só quando clicar
function carregarCanais(catId){
    lista.innerHTML = "Carregando canais...";

    fetch(proxy(`${server}/player_api.php?username=${user}&password=${pass}&action=get_live_streams`))
    .then(r=>r.json())
    .then(data=>{
        const filtrados = data.filter(c=>c.category_id == catId);

        lista.innerHTML = "";

        filtrados.forEach(c=>{
            const div = document.createElement("div");
            div.className="item";
            div.innerText = c.name;

            div.onclick = ()=>{
                const url = `${server}/live/${user}/${pass}/${c.stream_id}.m3u8`;
                play(url);
            }

            lista.appendChild(div);
        });
    });
}
</script>
